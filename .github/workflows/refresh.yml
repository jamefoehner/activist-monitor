name: Refresh filings

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC (about 7am Eastern)
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the updated feed

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Fetch, extract and label new filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m monitor.pipeline --days 30 --limit 60

      - name: Commit the feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.jsonl
          if git diff --cached --quiet; then
            echo "No new filings."
          else
            git commit -m "Update filings feed ($(date -u +%Y-%m-%d))"
            git push
          fi
